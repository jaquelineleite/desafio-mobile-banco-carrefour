stages:
  - validate
  - mobile

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/

validate-typescript:
  stage: validate
  image: node:20-bookworm

  script:
    - npm ci
    - npm run typecheck

mobile-android-browserstack:
  stage: mobile
  image: node:20-bookworm

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends openjdk-17-jre-headless
    - npm ci

  script:
    - npm run test:browserstack:android

  after_script:
    - npm run allure:generate || true

  artifacts:
    when: always
    paths:
      - allure-results/
      - allure-report/
      - logs/
      - screenshots/
    expire_in: 7 days

  rules:
    - if: '$BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY && $BROWSERSTACK_ANDROID_APP_ID'

mobile-ios-browserstack:
  stage: mobile
  image: node:20-bookworm

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends openjdk-17-jre-headless
    - npm ci

  script:
    - npm run test:browserstack:ios

  after_script:
    - npm run allure:generate || true

  artifacts:
    when: always
    paths:
      - allure-results/
      - allure-report/
      - logs/
      - screenshots/
    expire_in: 7 days

  rules:
    - if: '$BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY && $BROWSERSTACK_IOS_APP_ID'
